<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>
    <form class="register-form">
        <!-- Auth Header bên trong form -->
        <div class="auth-header">
            <h2 class="auth-title">Đăng Ký</h2>
        </div>
        
        <div class="form-group">
            <label class="form-label">Họ và Tên</label>
            <input type="text" class="form-input" required>
        </div>
        
        <div class="form-group">
            <label class="form-label">Số điện thoại</label>
            <input type="tel" class="form-input" required>
        </div>
        
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" required>
        </div>
        
        <div class="form-group">
            <label class="form-label">Mật khẩu</label>
            <div class="password-wrapper">
                <input type="password" class="form-input password-input" required>
                <button type="button" class="toggle-password">
                    <i class="far fa-eye-slash"></i>
                </button>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Nhập lại mật khẩu</label>
            <div class="password-wrapper">
                <input type="password" class="form-input password-input" required>
                <button type="button" class="toggle-password">
                    <i class="far fa-eye-slash"></i>
                </button>
            </div>
        </div>
        
        <div class="form-check-custom">
            <input type="checkbox" id="agreePolicy" checked>
            <label for="agreePolicy">
                Tôi đã đọc và đồng ý với <a href="#">Chính sách & quy định</a>.
            </label>
        </div>
        
        <button type="submit" class="btn-submit">Đăng Ký</button>
        
        <div class="login-link">
            Đã có tài khoản? <a href="login.html" class="switch-to-login">Đăng nhập ngay</a>
        </div>
    </form>

    <!-- API Script (phải được load trước) -->
    <script src="/ISP392-Font/api.js"></script>
    <script defer src="../js/register.js"></script>
</body>
</html>
