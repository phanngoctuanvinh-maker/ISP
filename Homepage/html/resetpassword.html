<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - DriveNow</title>
    <link rel="stylesheet" href="../css/resetpassword.css">
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <h2>🔐 Đặt lại mật khẩu</h2>
            <p class="subtitle">Nhập mã OTP đã được gửi về email của bạn</p>
        </div>
        
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="resetEmail">📧 Email đăng ký:</label>
                <input type="email" id="resetEmail" name="resetEmail" required readonly>
            </div>

            <div class="form-group">
                <label for="otpCode">🔢 Mã OTP (6 số):</label>
                <input type="text" id="otpCode" name="otpCode" maxlength="6" pattern="[0-9]{6}" 
                       placeholder="Nhập mã OTP 6 số" required>
                <small>Mã OTP có hiệu lực trong 5 phút</small>
            </div>

            <div class="form-group">
                <label for="newPassword">🔑 Mật khẩu mới:</label>
                <input type="password" id="newPassword" name="newPassword" 
                       minlength="6" placeholder="Tối thiểu 6 ký tự" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">✔️ Xác nhận mật khẩu:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" 
                       minlength="6" placeholder="Nhập lại mật khẩu mới" required>
            </div>

            <button type="submit" class="btn-submit">Đặt lại mật khẩu</button>
        </form>

        <div id="resetMessage"></div>

        <div class="footer-links">
            <a href="login.html">← Quay lại đăng nhập</a>
            <a href="forgotpassword.html" id="resendOtpLink">🔄 Gửi lại mã OTP</a>
        </div>
    </div>

    <script src="/ISP392-Font/api.js"></script>
    <script src="../js/resetpassword.js"></script>
</body>
</html>
