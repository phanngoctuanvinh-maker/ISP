<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Profile</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kumbh+Sans&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/adminProfile.css">
</head>
<body>
  <main class="main-content">
    <button class="back-btn" onclick="history.back()">&larr; Back</button>
    <div class="profile-form">
      <h2 class="title">Admin Profile</h2>
      <h4 class="username">ADMIN USER</h4>

      <form id="profileForm">
        <!-- Full name -->
        <label class="form-label">Full Name</label>
        <input type="text" id="fullName" class="form-input" value="Admin User">

        <div class="row">
          <!-- Email -->
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <div class="input-icon">
              <i class="fas fa-envelope"></i>
              <input type="text" id="email" class="form-input" value="admin@example.com">
            </div>
            <div class="error" id="emailError"></div>
          </div>
          <!-- Phone -->
          <div class="col-md-6">
            <label class="form-label">Phone Number</label>
            <div class="input-icon">
              <i class="fas fa-mobile-alt"></i>
              <input type="text" id="phone" class="form-input" value="0123456789">
            </div>
            <div class="error" id="phoneError"></div>
          </div>
        </div>

        <!-- Address -->
        <label class="form-label">Address</label>
        <div class="input-icon">
          <i class="fas fa-map-marker-alt"></i>
          <input type="text" id="address" class="form-input" value="Hanoi, Vietnam">
        </div>

        <!-- Buttons -->
        <div class="btn-group">
          <a href="admin.html" class="btn btn-outline">Cancel</a>
          <a href="changePassword.html" class="btn btn-secondary">Change Password</a>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </main>

  <script src="../js/adminProfile.js"></script>
  <script src="/ISP392-Font/api.js"></script>
</body>
</html>
