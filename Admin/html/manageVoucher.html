<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Vouchers - Admin</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/manageVoucher.css">
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="text-center py-2">
                <h4 style="color: #234C45; font-weight: 600; margin-bottom: 0;">Admin Panel</h4>
            </div>
            <nav>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">
                            <i class="bi bi-speedometer2 me-2"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="adminManagerUser.html">
                            <i class="bi bi-people me-2"></i>Manage Users
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="potentialCustomer.html">
                            <i class="bi bi-star me-2"></i>Potential Customers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="manageVoucher.html">
                            <i class="bi bi-ticket-perforated me-2"></i>Manage Vouchers
                        </a>
                    </li>
                    <li class="nav-item mt-auto">
                        <button class="btn btn-danger w-100 logout-btn" onclick="logout()">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </button>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow-1">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <h5 class="mb-0 text-white">Manage Vouchers</h5>
                </div>
            </div>

            <!-- Content Area -->
            <div class="container-fluid px-4 py-4">
                <h2 class="voucher-title">Manage Vouchers</h2>
                
                <!-- Alert Message -->
                <div id="alertContainer"></div>

                <!-- Add Voucher Form -->
                <form id="addVoucherForm" class="voucher-form">
                    <div class="row g-2 align-items-center">
                        <div class="col-md-2">
                            <input type="text" class="form-control" id="voucherCode" name="voucherCode" 
                                   placeholder="Code" required>
                        </div>
                        <div class="col-md-2">
                            <input type="number" class="form-control" id="discountValue" name="discountValue" 
                                   placeholder="Discount" step="0.01" required>
                        </div>
                        <div class="col-md-3">
                            <input type="date" class="form-control" id="expiryDate" name="expiryDate" required>
                        </div>
                        <div class="col-md-2">
                            <select class="form-select" id="status" name="status">
                                <option value="Active" selected>Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <button type="submit" class="btn btn-success btn-add">Add</button>
                        </div>
                    </div>
                </form>

                <!-- Vouchers Table -->
                <div class="table-responsive mt-4">
                    <table class="table table-bordered table-hover align-middle bg-white">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Code</th>
                                <th>Discount</th>
                                <th>Expiry Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="voucherTableBody">
                            <tr>
                                <td colspan="6" class="text-center">
                                    <div class="spinner-border text-success" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../js/manageVoucher.js"></script>
    <script src="/ISP392-Font/api.js"></script>
</body>
</html>
