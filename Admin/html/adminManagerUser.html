<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage User Accounts</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@100..900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/adminManagerUser.css">
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="text-center py-2">
                <h4 style="color: #234C45; font-weight: 600; margin-bottom: 0;">Admin Panel</h4>
            </div>
            <nav>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">
                            <i class="bi bi-speedometer2 me-2"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="adminManagerUser.html">
                            <i class="bi bi-people me-2"></i>Manage Users
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="potentialCustomer.html">
                            <i class="bi bi-star me-2"></i>Potential Customers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="manageVoucher.html">
                            <i class="bi bi-ticket-perforated me-2"></i>Manage Vouchers
                        </a>
                    </li>
                    <li class="nav-item mt-auto">
                        <button class="btn btn-danger w-100 logout-btn" onclick="logout()">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </button>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow-1">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <h5 class="mb-0 text-white">Manage User Accounts</h5>
                </div>
            </div>

            <!-- Content Area -->
            <div class="container-fluid px-4 py-4">
                <h2 class="mb-4" style="color:#234C45;font-weight:600;">Manage User Accounts</h2>
                
                <!-- Search Form -->
                <form id="searchForm" class="row g-2 align-items-center mb-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="keyword" name="keyword" 
                               placeholder="Search by name, email, address, or role...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="role" name="role">
                            <option value="all">All Roles</option>
                            <option value="User">User</option>
                            <option value="Staff">Staff</option>
                            <option value="Shipper">Shipper</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-success" style="background:#234C45;">Search</button>
                    </div>
                    <div class="col-auto">
                        <button type="button" class="btn btn-secondary" onclick="resetSearch()">Cancel</button>
                    </div>
                    <div class="col-auto">
                        <a href="createUserAccount.html" 
                           class="btn btn-outline-success" 
                           style="color:#234C45;border-color:#234C45;">
                            Create New Account
                        </a>
                    </div>
                </form>

                <!-- Alert Message -->
                <div id="alertContainer"></div>

                <!-- User Table -->
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle bg-white">
                        <thead class="table-light">
                            <tr>
                                <th>UserID</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Address</th>
                                <th>Role</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <tr>
                                <td colspan="7" class="text-center">
                                    <div class="spinner-border text-success" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../js/adminManagerUser.js"></script>
    <script src="/ISP392-Font/api.js"></script>
</body>
</html>
