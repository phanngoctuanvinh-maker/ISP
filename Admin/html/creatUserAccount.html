<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New User Account - Admin</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/adminProfile.css">
    <link rel="stylesheet" href="../css/createUserAccount.css">
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar-custom d-flex justify-content-end align-items-center px-4 py-2">
        <button class="btn btn-sm btn-light" onclick="window.location.href='../login.jsp'">
            <i class="bi bi-box-arrow-right me-2"></i>Logout
        </button>
    </div>

    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar-custom">
            <button class="back-btn" onclick="history.back()">&larr; Back</button>
            <div class="text-center py-4">
                <img src="#" alt="" style="max-width: 150px;">
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="admin.html">
                        <i class="bi bi-house-door me-2"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="adminManagerUser.html">
                        <i class="bi bi-people me-2"></i> Manage User Accounts
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="flex-grow-1 p-4">
            <div class="container-fluid create-user-container">
                <h2 class="create-user-title">Create New User Account</h2>
                
                <!-- Alert Message -->
                <div id="alertMessage" class="alert create-user-alert d-none" role="alert"></div>
                
                <form id="createUserForm" class="create-user-form">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" name="fullName" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" name="address" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" id="phone" name="phone" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm" name="confirm" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select class="form-select" id="role" name="role">
                            <option value="User">User</option>
                            <option value="Staff">Staff</option>
                            <option value="Shipper">Shipper</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>

                    <div class="create-user-buttons">
                        <button type="submit" class="btn btn-success btn-create">Create</button>
                        <button type="button" class="btn btn-outline-secondary btn-cancel" onclick="handleCancel()">Cancel</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="../js/createUserAccount.js"></script>
    <script src="/ISP392-Font/api.js"></script>
</body>
</html>
